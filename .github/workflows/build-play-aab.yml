name: Build Play AAB

# Builds a signed Android App Bundle for Google Play, uploaded as a workflow
# artifact. Signed with the dedicated upload key (Play App Signing) — separate
# from the GitHub-APK key used by build-release.yml. First Play release is
# manual: download the artifact and upload it in the Play Console.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Remove Termux-specific AAPT2 path
        run: sed -i 's/^android.aapt2FromMavenOverride=/#&/' gradle.properties

      - name: Decode upload keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE }}" | base64 -d > upload-keystore.jks

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          EOF

      - name: Build signed AAB
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t9-app-dialer-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
