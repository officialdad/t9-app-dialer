name: Release Please

# Opens one release PR from the conventional commits on main. Merging that PR
# bumps the version, writes CHANGELOG.md, publishes the vX.Y.Z GitHub release
# and creates its tag. This workflow never builds the APK: the release it
# publishes starts build-release.yml, which attaches the signed APK.
on:
  push:
    branches: [main]

permissions: {}

# Two runs at once can race on the release PR's branch.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The default GITHUB_TOKEN opens no workflow runs, so a release PR and a
      # tag it creates would start neither CI nor build-release.yml. This App
      # token does, and RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are the
      # repository secrets that hold its credentials.
      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open or update the release PR, or tag a merged one
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
